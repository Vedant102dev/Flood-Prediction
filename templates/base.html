<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rescue Force</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f7fa;
            color: #333;
        }
        nav {
            background: #0077b6;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            margin-left: 1rem;
            text-decoration: none;
            font-weight: bold;
        }
        .home-container {
            text-align: center;
            margin-top: 100px;
        }
        .home-container h1 {
            font-size: 3rem;
            color: #0077b6;
        }
        .home-container p {
            font-size: 1.2rem;
            margin: 20px auto;
            width: 60%;
        }
        .btn {
            background: #0077b6;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            text-decoration: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #005f87;
        }
        .card {
            background-color: #ffffff;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .card h4 {
            margin: 0;
            font-size: 15px;
            color: #666;
        }
        .card p {
            margin-top: 8px;
            font-size: 22px;
            font-weight: bold;
            color: #222;
        }


        @media (max-width: 650px) {
            nav {
                flex-direction: column;
                gap: 12px;
                padding: 1rem;
                text-align: center;
            }
            nav a {
                margin: 0 6px;
                font-size: 0.95rem;
            }
            .home-container {
                margin-top: 40px !important;
                padding: 0 15px;
            }
            .home-container h1 {
                font-size: 2.2rem !important;
            }
            .home-container p {
                width: 100% !important;
                font-size: 1rem !important;
            }
            .card {
                width: 140px;
                padding: 15px 10px;
            }
            .card p {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div><strong>🌊 RESCUE FORCE</strong></div>
        <div>
            <a href="/">Home</a>
            <a href="/map">Live Risk Map (India)</a>
            <a href="/predict">Search by City</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
